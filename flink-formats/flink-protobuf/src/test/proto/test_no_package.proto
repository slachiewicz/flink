// No "package" statement and no "option java_package": regression fixture for FLINK-35034.
// The generated Java class ends up in Java's unnamed (default) package.
syntax = "proto3";

option java_outer_classname = "UserProtoBuf";

message User {
  int32 id = 1;
  string name = 2;
}
